name: Weekly Clinical Map Context

on:
  schedule:
    # Friday 18:17 UTC = Saturday 02:17 Asia/Taipei.
    - cron: '17 18 * * 5'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the validated JSON after a successful run'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-clinical-context
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install weekly dependencies
        run: python -m pip install 'pandas==2.2.3' 'numpy==2.3.5' 'yfinance==1.7.0'
      - name: Check completed-week boundaries and seed regression
        run: python -m unittest discover -s tests -p test_weekly_schedule.py
      - name: Generate and validate 11-stock context
        run: python weekly_pipeline.py
      - name: Preserve candidate and source audit
        uses: actions/upload-artifact@v7
        with:
          name: weekly-context-${{ github.run_id }}
          path: outputs/weekly_job/
          if-no-files-found: error
          retention-days: 90
      - name: Publish successful weekly context
        if: github.event_name == 'schedule' || inputs.publish
        run: |
          cp outputs/weekly_job/clinical_map_weekly_context_candidate.json clinical_map_weekly_context.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- clinical_map_weekly_context.json
          if git diff --cached --quiet; then
            echo 'Validated context already matches published JSON.'
          else
            git commit -m 'Update validated completed-week Clinical Map context'
            git push origin HEAD:main
          fi
